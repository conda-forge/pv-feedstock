schema_version: 1

context:
  version: "1.12.0"

package:
  name: pv
  version: ${{ version }}

source:
  url: https://ivarch.com/s/pv-${{ version }}.tar.gz
  sha256: 31fdbdb449c7143cd2968567bef7599e9f031950e6158ee7bb76e40aebf6ffb8

build:
  number: 0
  skip: win
  script:
    content:
      - ./configure --prefix="${PREFIX}" --build="${BUILD}" --host="${HOST}"
      - make -j"${CPU_COUNT}"
      - if: build_platform == target_platform
        then:
          # Re-run only failed tests once: 10 tests assert tight timing
          # windows and are flaky on loaded CI runners; deterministic
          # failures still fail the recheck.
          - make check || make recheck || make recheck
      - make install

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
    - gettext-tools
  host:
    - if: osx
      then: libintl-devel

tests:
  - script:
      - pv --version
      - echo hello world | pv -q | grep hello
  - package_contents:
      bin:
        - pv

about:
  homepage: https://www.ivarch.com/programs/pv.shtml
  repository: https://codeberg.org/ivarch/pv
  documentation: https://www.ivarch.com/programs/quickref/pv.shtml
  license: GPL-3.0-or-later
  license_file: docs/COPYING
  summary: Monitor the progress of data through a pipe
  description: |
    pv (Pipe Viewer) is a terminal-based tool for monitoring the progress of
    data through a pipeline and modifying its flow. It displays how quickly
    data is being transferred, how long it has taken, how near to completion
    it is, and an estimate of how long it will be until completion.

extra:
  recipe-maintainers:
    - shahin
    - dbast
